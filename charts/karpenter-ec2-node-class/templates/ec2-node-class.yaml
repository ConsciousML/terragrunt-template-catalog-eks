apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ .Values.name | quote }}
spec:
  role: {{ .Values.nodeRole | quote }}
  amiSelectorTerms:
    - alias: {{ .Values.amiAlias | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  {{- if .Values.kubeletMaxPods }}
  # Karpenter computes max-pods per instance type from the plain per-ENI IPv4 formula,
  # blind to the cluster's VPC CNI prefix-delegation setting, without this override.
  kubelet:
    maxPods: {{ .Values.kubeletMaxPods }}
  {{- end }}
